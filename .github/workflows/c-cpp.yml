name: Build Blender

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Blender source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git cmake ninja-build \
            libx11-dev libxi-dev libxxf86vm-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libglew-dev libgl1-mesa-dev libglu1-mesa-dev \
            libssl-dev libpng-dev libzstd-dev libfreetype6-dev \
            libjpeg-dev libtiff-dev libopenexr-dev libopenimageio-dev \
            libopencolorio-dev libopenvdb-dev libboost-all-dev \
            libfftw3-dev libsndfile1-dev libtbb-dev libjemalloc-dev \
            libpugixml-dev python3-dev python3-requests python3-numpy

      - name: Update Blender submodules and libraries
        run: make update

      - name: Configure build with CMake
        run: |
          mkdir -p ../build_linux
          cd ../build_linux
          cmake ../blender -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Blender
        run: |
          cd ../build_linux
          ninja

      - name: Upload Blender binary
        uses: actions/upload-artifact@v4
        with:
          name: blender-bin
          path: ../build_linux/bin/blender
